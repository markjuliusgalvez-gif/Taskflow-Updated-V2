name: Build Flutter APK & IPA

on:
  push:
    branches: [ master, main ]
  release:
    types: [ published ]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Verify APK was produced
        run: ls -la build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  build-ipa:
    name: Build IPA (unsigned, for Sideloadly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter doctor (diagnostic info)
        run: flutter doctor -v

      - run: flutter pub get

      # Some Flutter iOS projects need pods installed explicitly before
      # building, especially if plugins are used. This step won't fail
      # the build if there's no Podfile.
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update || echo "pod install skipped or failed, continuing"
          cd ..

      # --no-codesign skips Apple signing entirely, which is required
      # since we have no Apple Developer certs in CI.
      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign --verbose

      # This step will now FAIL LOUDLY (not silently) if Runner.app
      # was never produced, instead of the zip step quietly making
      # an empty/broken .ipa.
      - name: Verify Runner.app exists
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not built. Check the 'Build iOS app' step above for the real failure."
            exit 1
          fi
          echo "Runner.app found:"
          ls -la build/ios/iphoneos/Runner.app

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r app-unsigned.ipa Payload

      - name: Verify IPA was created
        run: |
          if [ ! -f "build/ios/iphoneos/app-unsigned.ipa" ]; then
            echo "ERROR: app-unsigned.ipa was not created."
            exit 1
          fi
          ls -la build/ios/iphoneos/app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/ios/iphoneos/app-unsigned.ipa

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/iphoneos/app-unsigned.ipa
