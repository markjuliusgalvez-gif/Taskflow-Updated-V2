name: Build Flutter APK & IPA

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write # Required to create releases and attach assets

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build Android APK (Runs on Linux)
  # -------------------------------------------------------------
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # -------------------------------------------------------------
  # JOB 2: Build iOS IPA (Runs on macOS)
  # -------------------------------------------------------------
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA (Unsigned)
        run: flutter build ipa --release --no-codesign

      # Creates a zip payload if an .ipa isn't automatically structured without signing
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          mv build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r build/ios/ipa/Runner-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/Runner-unsigned.ipa

  # -------------------------------------------------------------
  # JOB 3: Publish to GitHub Releases (Runs after builds finish)
  # -------------------------------------------------------------
  release:
    needs: [build-apk, build-ipa]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: output

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-ipa
          path: output

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/app-release.apk
            output/Runner-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
