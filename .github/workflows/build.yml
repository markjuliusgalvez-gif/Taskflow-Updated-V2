name: Build Flutter APK & IPA

on:
  push:
    tags:
      - 'v*'           # v1.0.0, v2.1.3, etc.
      - 'release-*'    # release-1.0.0, release-2.0, etc.
      - '*.*.*'        # 1.0.0, 2.1.3, etc. (no "v")
  workflow_dispatch:   # Still allows manual runs

jobs:
  build:
    name: Build APK & IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build iOS IPA (Release)
        run: flutter build ipa --release --no-codesign

      # Upload temporary Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ios/ipa/*.ipa
          retention-days: 30

      # Create GitHub Release for any matching tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ios/ipa/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
